services:
  atlantis:
    image: infra-atlantis:latest
    container_name: atlantis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ATLANTIS_DEFAULT_TF_DISTRIBUTION=opentofu
    ports:
      - "127.0.0.1:4141:4141"
    volumes:
      - /opt/infra/atlantis-data:/atlantis
      - /root/.ssh:/root/.ssh:ro
    command: server
