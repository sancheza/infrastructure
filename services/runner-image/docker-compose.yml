services:
  atlantis:
    image: infra-atlantis:latest
    container_name: atlantis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ATLANTIS_DEFAULT_TF_DISTRIBUTION=opentofu
      - ATLANTIS_REPO_CONFIG=/atlantis-config/repos.yaml
    ports:
      - "127.0.0.1:4141:4141"
    volumes:
      - /opt/infra/atlantis-data:/atlantis
      - /opt/infra/atlantis-ssh:/root/.ssh:ro
      - ./repos.yaml:/atlantis-config/repos.yaml:ro
      - /opt/infra/tfstate:/tfstate
    command: server
