- name: Deploy and Initialize HashiCorp Vault
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for container to acquire DHCP lease and open SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 180

    - name: Gather facts once SSH is online
      ansible.builtin.setup:

    - name: Authorize admin SSH key for direct human access
      ansible.builtin.lineinfile:
        path: /root/.ssh/authorized_keys
        line: "{{ admin_ssh_key }}"
        create: true
        mode: "0600"

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - curl
          - gpg
          - lsb-release
          - jq
        state: present
        update_cache: true

    - name: Add HashiCorp GPG key
      ansible.builtin.shell: |
        curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Add HashiCorp APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/hashicorp.list
        content: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main\n"

    - name: Install HashiCorp Vault
      ansible.builtin.apt:
        name: vault
        state: present
        update_cache: true

    - name: Set VAULT_ADDR for interactive shells
      ansible.builtin.copy:
        dest: /etc/profile.d/vault.sh
        content: |
          export VAULT_ADDR=http://127.0.0.1:8200
        mode: "0644"

    - name: Prepare Raft storage directory
      ansible.builtin.file:
        path: /opt/vault/data
        state: directory
        owner: vault
        group: vault
        mode: '0700'

    - name: Deploy vault.hcl configuration
      ansible.builtin.copy:
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: '0640'
        content: |
          storage "raft" {
            path    = "/opt/vault/data"
            node_id = "{{ inventory_hostname }}"
          }

          listener "tcp" {
            address     = "0.0.0.0:8200"
            tls_disable = 1
          }

          ui = true
          disable_mlock = true
          api_addr     = "http://{{ ansible_default_ipv4.address }}:8200"
          cluster_addr = "http://{{ ansible_default_ipv4.address }}:8201"

    - name: Restart and enable Vault service
      ansible.builtin.systemd:
        name: vault
        enabled: true
        state: restarted

    - name: Check Vault cluster status
      ansible.builtin.uri:
        url: "http://127.0.0.1:8200/v1/sys/health"
        status_code: [200, 429, 501, 503]
      register: vault_health

    - name: Initialize Vault operator if uninitialized
      ansible.builtin.command: vault operator init -format=json -key-shares=5 -key-threshold=3
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
      when: vault_health.status == 501
      register: init_payload

    - name: Save unseal keys to runner container storage
      ansible.builtin.copy:
        content: "{{ init_payload.stdout }}"
        dest: "{{ playbook_dir }}/vault-cluster-keys.json"
        mode: '0600'
      delegate_to: localhost
      when: init_payload.changed

    - name: Read cluster keys
      ansible.builtin.set_fact:
        vault_keys: "{{ lookup('file', playbook_dir + '/vault-cluster-keys.json') | from_json }}"

    - name: Unseal Vault
      ansible.builtin.command: "vault operator unseal {{ item }}"
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
      loop: "{{ vault_keys.unseal_keys_b64[:3] }}"
      register: unseal_result
      changed_when: "'Sealed: false' in unseal_result.stdout"
      # 200 = unsealed and active, 429 = unsealed and standby; either means
      # a prior run already unsealed it, so skip re-submitting keys.
      when: vault_health.status not in [200, 429]

    - name: Enable KV v2 secret engine
      ansible.builtin.command: vault secrets enable -path=secret kv-v2
      environment:
        VAULT_ADDR: "http://127.0.0.1:8200"
        VAULT_TOKEN: "{{ vault_keys.root_token }}"
      register: engine_result
      failed_when: engine_result.rc != 0 and 'path is already in use' not in engine_result.stderr
      changed_when: engine_result.rc == 0

    - name: Verify Vault is unsealed and reachable
      ansible.builtin.uri:
        url: "http://127.0.0.1:8200/v1/sys/health"
        status_code: [200, 429]
      register: final_health
      retries: 3
      delay: 2
      until: final_health.status in [200, 429]
